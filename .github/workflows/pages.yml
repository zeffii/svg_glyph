# Publishes public/ to GitHub Pages on every push to master.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Stamp build number and commit
        run: |
          BUILD=$(grep -m1 -oE '^## [0-9]+' CHANGELOG.md | cut -c4-)
          printf '{"build":"%s","commit":"%s","date":"%s"}\n' "$BUILD" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%d)" > public/version.json
          cat public/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
